spring:
  application:
    name: payment-core-test
  datasource:
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      connection-init-sql: "SET lock_timeout = '10000ms'"
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}

app:
  outbox:
    relay:
      enabled: false
      poll-rate-ms: 500
      batch-size: 50
      lease-duration-seconds: 30
      max-attempts: 5
  kafka:
    topics:
      transaction-posted: transactions.posted
      account-balance-changed: accounts.balance-changed

server:
  port: -1

