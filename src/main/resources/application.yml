spring:
  application:
    name: payment-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_ledger}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      connection-init-sql: "SET lock_timeout = '3000ms'"
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

app:
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:true}
      poll-rate-ms: 500
      batch-size: 50
      lease-duration-seconds: 30
      max-attempts: 5
  kafka:
    topics:
      transaction-posted: transactions.posted
      account-balance-changed: accounts.balance-changed
  velocity:
    window-seconds: ${VELOCITY_WINDOW_SECONDS:3600}
    max-amount-paise: ${VELOCITY_MAX_AMOUNT_PAISE:50000000} # ₹5,00,000 per hour limit
  reconciliation:
    enabled: ${RECONCILIATION_ENABLED:true}
    cron: ${RECONCILIATION_CRON:0 */15 * * * *}

server:
  port: 8080

